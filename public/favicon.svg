<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8d0e0"/>
      <stop offset="50%" stop-color="#e0e8f0"/>
      <stop offset="100%" stop-color="#a0b0c8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b44c"/>
      <stop offset="100%" stop-color="#d4991f"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c94040"/>
      <stop offset="100%" stop-color="#8b2020"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0d1b2a"/>
  <!-- Sword blade -->
  <path d="M256 60 L248 240 L256 300 L264 240 Z" fill="url(#blade)"/>
  <!-- Blade edge glow -->
  <path d="M256 60 L253 240 L256 300 L259 240 Z" fill="url(#gold)" opacity="0.6"/>
  <!-- Crossguard (dragon wing style) -->
  <path d="M180 260 C160 240 140 200 130 170 C145 195 165 225 195 255 L210 268 Z" fill="url(#wing)"/>
  <path d="M332 260 C352 240 372 200 382 170 C367 195 347 225 317 255 L302 268 Z" fill="url(#wing)"/>
  <!-- Crossguard center -->
  <rect x="220" y="256" width="72" height="16" rx="4" fill="url(#gold)"/>
  <!-- Grip -->
  <rect x="250" y="272" width="12" height="60" rx="3" fill="#1b2d4a"/>
  <rect x="248" y="272" width="16" height="60" rx="4" fill="#2a3f5f"/>
  <!-- Pommel -->
  <circle cx="256" cy="345" r="14" fill="url(#gold)"/>
  <circle cx="256" cy="345" r="8" fill="#c94040"/>
  <!-- Teal magical aura -->
  <circle cx="256" cy="260" r="120" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="260" r="90" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.2"/>
</svg>
